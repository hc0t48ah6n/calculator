<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="google-site-verification" content="xSMe8NjOJitIbihp_Rs4ctuOhG8ogC3gYNH4PRTPxKA" />
<meta charset="UTF-8">
<title>web関数電卓</title>
<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #1a1d23, #0f1115);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.calculator {
  display: flex;
  background: #2a2e37;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 0 30px #0008;
  gap: 20px;
}

.display-panel {
  display: flex;
  flex-direction: column;
  width: 300px;
  position: relative;
}

#display {
  height: 70px;
  font-size: 28px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: none;
  padding: 10px;
  text-align: right;
  background: #1a1d23;
  color: #00ffcc;
  overflow: hidden;
  position: relative;
}

#display span {
  display: inline-block;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.history {
  flex: 1;
  background: #20232a;
  border-radius: 10px;
  padding: 10px;
  overflow-y: auto;
  font-size: 14px;
  color: #aaa;
  box-shadow: inset 0 0 10px #0003;
}

.buttons-section {
  display: flex;
  gap: 20px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 70px);
  grid-auto-rows: 60px;
  gap: 10px;
  padding: 10px;
  border-radius: 15px;
  transition: 0.3s;
}

.buttons.left { background: rgba(255,255,255,0.03); }
.buttons.right { background: rgba(0,255,255,0.05); }

.buttons button {
  font-size: 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #3b3f4a;
  color: #fff;
  transition: 0.2s;
  box-shadow: 0 4px #0004;
}
.buttons button:hover { background: #505664; }
.buttons button:active { transform: translateY(2px); box-shadow: 0 2px #0004; }

.mode { background: #0078ff; grid-column: span 2; }
.equal { background: #00b894; grid-column: span 2; }
.clear { background: #d63031; }
</style>
</head>
<body>
<div class="calculator">
  <div class="display-panel">
    <div id="display"></div>
    <div class="history" id="history"></div>
  </div>

  <div class="buttons-section">
    <div class="buttons left">
      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button onclick="append('/')">÷</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button onclick="append('*')">×</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="append('-')">−</button>

      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
      <button onclick="append('+')">＋</button>
    </div>

    <div class="buttons right">
      <button onclick="append('(')">(</button>
      <button onclick="append(')')">)</button>
      <button onclick="append('**')">^</button>
      <button onclick="append('Math.sqrt(')">√</button>

      <button onclick="append('sin(')">sin</button>
      <button onclick="append('cos(')">cos</button>
      <button onclick="append('tan(')">tan</button>
      <button onclick="append('Math.log(')">ln</button>

      <button class="mode" onclick="toggleMode()">モード: <span id="modeLabel">DEG</span></button>
      <button class="clear" onclick="clearDisplay()">C</button>
    </div>
  </div>
</div>

<script>
let display = document.getElementById('display');
let history = document.getElementById('history');
let mode = 'DEG';
let currentValue = '';

function renderDisplay() {
  display.innerHTML = '';
  currentValue.split('').forEach(char=>{
    let span = document.createElement('span');
    span.textContent = char;
    span.style.transform = 'translateY(-20px)';
    span.style.opacity = 0;
    display.appendChild(span);
    requestAnimationFrame(()=>{
      span.style.transform = 'translateY(0)';
      span.style.opacity = 1;
    });
  });
}

function append(value){
  currentValue += value;
  renderDisplay();
}

function clearDisplay(){
  currentValue = '';
  renderDisplay();
}

function toggleMode() {
  mode = (mode==='DEG')?'RAD':'DEG';
  document.getElementById('modeLabel').textContent = mode;
}

function calculate() {
  try{
    let expr = currentValue;
    expr = expr.replace(/sin\((.*?)\)/g, (_, x)=>`Math.sin(${convertAngle(x)})`);
    expr = expr.replace(/cos\((.*?)\)/g, (_, x)=>`Math.cos(${convertAngle(x)})`);
    expr = expr.replace(/tan\((.*?)\)/g, (_, x)=>`Math.tan(${convertAngle(x)})`);
    let result = eval(expr);
    if(Number.isFinite(result)) {
      let resNode = document.createElement('div');
      resNode.innerHTML = `${currentValue} = ${result}`;
      resNode.style.opacity = 0;
      resNode.style.transition = 'opacity 0.3s';
      history.appendChild(resNode);
      requestAnimationFrame(()=> resNode.style.opacity=1);
      currentValue = result.toString();
      renderDisplay();
      history.scrollTop = history.scrollHeight;
    } else { currentValue = 'エラー'; renderDisplay(); }
  } catch{ currentValue = 'エラー'; renderDisplay(); }
}

function convertAngle(x){ return mode==='DEG'?`(${x})*Math.PI/180`: x; }
</script>
</body>
</html>
